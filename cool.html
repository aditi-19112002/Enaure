<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rating with Emoji</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:grid;
place-items:center;
background:#111827;
}

.box{
text-align:center;
}

.rating{
display:flex;
flex-direction:row-reverse;
justify-content:center;
gap:10px;
margin-bottom:20px;
}

.rating input{
display:none;
}

.rating label{
font-size:55px;
color:#555;
cursor:pointer;
transition:.3s;
}

.rating label:hover,
.rating label:hover~label{
color:#facc15;
transform:scale(1.15);
}

.rating input:checked~label{
color:#fbbf24;
}

.emoji{
font-size:90px;
height:100px;
transition:.4s;
}

#star1:checked ~ .emoji::before{
content:"😡";
}

#star2:checked ~ .emoji::before{
content:"😕";
}

#star3:checked ~ .emoji::before{
content:"😐";
}

#star4:checked ~ .emoji::before{
content:"😊";
}

#star5:checked ~ .emoji::before{
content:"🤩";
}

.emoji::before{
content:"🙂";
}
</style>
</head>
<body>

<div class="box">

<div class="rating">
<input type="radio" id="star5" name="rate">
<label for="star5"><i class="fa-solid fa-star"></i></label>

<input type="radio" id="star4" name="rate">
<label for="star4"><i class="fa-solid fa-star"></i></label>

<input type="radio" id="star3" name="rate">
<label for="star3"><i class="fa-solid fa-star"></i></label>

<input type="radio" id="star2" name="rate">
<label for="star2"><i class="fa-solid fa-star"></i></label>

<input type="radio" id="star1" name="rate">
<label for="star1"><i class="fa-solid fa-star"></i></label>

<div class="emoji"></div>
</div>

</div>

</body>
</html>
