<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9 Dots Menu</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="h-screen grid place-items-center bg-white">

<div id="box"
class="grid grid-cols-3 gap-3 bg-gray-100 p-5 rounded-2xl shadow-xl cursor-pointer transition-all duration-300">
</div>

<script>
const box=document.getElementById("box");

const icons=[
"house",
"user",
"phone",
"gear",
"xmark",
"heart",
"image",
"comment",
"bell"
];

function dots(){
box.innerHTML="";

for(let i=0;i<9;i++){
box.innerHTML+=`
<div class="w-3 h-3 bg-slate-800 rounded-full transition-all duration-300 hover:scale-150"></div>`;
}

box.onclick=openMenu;
}

function openMenu(){

box.innerHTML="";

icons.forEach((icon,i)=>{

box.innerHTML+=`
<div class="icon scale-0 opacity-0 w-11 h-11 rounded-xl bg-white border border-gray-200 text-slate-700 shadow-md flex items-center justify-center cursor-pointer transition-all duration-300 hover:bg-blue-500 hover:text-white hover:scale-110">
<i class="fa-solid fa-${icon}"></i>
</div>`;

});

document.querySelectorAll(".icon").forEach((item,index)=>{

setTimeout(()=>{
item.classList.remove("scale-0","opacity-0");
},index*70);

item.onclick=(e)=>{

e.stopPropagation();

if(index===4){

document.querySelectorAll(".icon").forEach((el,j)=>{

setTimeout(()=>{
el.classList.add("scale-0","opacity-0");

if(j===8){
setTimeout(dots,250);
}

},j*50);

});

}else{

item.classList.toggle("bg-blue-500");
item.classList.toggle("text-white");
item.classList.toggle("border-blue-500");

}

};

});

}

dots();

</script>

</body>
</html>
