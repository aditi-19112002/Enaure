<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Animated Form Toggle Morphing</title>
</head>

<body class="bg-gradient-to-br from-slate-900 via-black to-slate-800 min-h-screen flex items-center justify-center px-4 overflow-hidden">

  <div class="relative w-full max-w-4xl h-[550px] bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl overflow-hidden shadow-2xl">

    <!-- Sliding Background -->
    <div id="slider"
      class="absolute top-0 left-0 w-1/2 h-full bg-gradient-to-br from-cyan-500 to-blue-600 rounded-3xl transition-all duration-700 ease-in-out z-10 flex flex-col items-center justify-center text-white p-10">

      <h1 id="sliderTitle" class="text-4xl font-bold mb-4">
        Welcome Back
      </h1>

      <p id="sliderText" class="text-center text-sm text-white/80 mb-6">
        Login to continue your journey with us.
      </p>

      <button id="toggleBtn"
        class="px-8 py-3 border border-white rounded-full hover:bg-white hover:text-blue-600 duration-300 font-semibold">
        Sign Up
      </button>
    </div>

    <!-- Forms Wrapper -->
    <div class="absolute inset-0 flex">

      <!-- Login Form -->
      <div class="w-1/2 flex items-center justify-center p-8">
        <form class="w-full max-w-sm space-y-5">

          <h2 class="text-3xl font-bold text-white mb-6">
            Login
          </h2>

          <input
            type="email"
            placeholder="Email"
            class="w-full px-5 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder:text-white/60 outline-none focus:ring-2 focus:ring-cyan-400"
          />

          <input
            type="password"
            placeholder="Password"
            class="w-full px-5 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder:text-white/60 outline-none focus:ring-2 focus:ring-cyan-400"
          />

          <button
            class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-600 duration-300 text-white font-semibold shadow-lg">
            Login
          </button>

        </form>
      </div>

      <!-- Signup Form -->
      <div class="w-1/2 flex items-center justify-center p-8">
        <form class="w-full max-w-sm space-y-5">

          <h2 class="text-3xl font-bold text-white mb-6">
            Sign Up
          </h2>

          <input
            type="text"
            placeholder="Full Name"
            class="w-full px-5 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder:text-white/60 outline-none focus:ring-2 focus:ring-pink-400"
          />

          <input
            type="email"
            placeholder="Email"
            class="w-full px-5 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder:text-white/60 outline-none focus:ring-2 focus:ring-pink-400"
          />

          <input
            type="password"
            placeholder="Password"
            class="w-full px-5 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder:text-white/60 outline-none focus:ring-2 focus:ring-pink-400"
          />

          <button
            class="w-full py-3 rounded-xl bg-pink-500 hover:bg-pink-600 duration-300 text-white font-semibold shadow-lg">
            Create Account
          </button>

        </form>
      </div>

    </div>

  </div>

  <script>

    const toggleBtn = document.getElementById("toggleBtn");
    const slider = document.getElementById("slider");
    const sliderTitle = document.getElementById("sliderTitle");
    const sliderText = document.getElementById("sliderText");

    let active = false;

    toggleBtn.addEventListener("click", () => {

      active = !active;

      if(active){

        slider.classList.remove("left-0");
        slider.classList.add("left-1/2");

        slider.classList.remove("from-cyan-500","to-blue-600");
        slider.classList.add("from-pink-500","to-purple-600");

        sliderTitle.innerText = "Hello Friend";
        sliderText.innerText = "Create an account and start your experience.";
        toggleBtn.innerText = "Login";

      }

      else{

        slider.classList.remove("left-1/2");
        slider.classList.add("left-0");

        slider.classList.remove("from-pink-500","to-purple-600");
        slider.classList.add("from-cyan-500","to-blue-600");

        sliderTitle.innerText = "Welcome Back";
        sliderText.innerText = "Login to continue your journey with us.";
        toggleBtn.innerText = "Sign Up";

      }

    });

  </script>

</body>
</html>
