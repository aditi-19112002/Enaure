<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <script src="https://cdn.tailwindcss.com"></script>

 
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <title>3D Book Portfolio</title>

  <style>

    body{
      margin:0;
      padding:0;
      background:#050816;
      overflow:hidden;
      font-family:sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      perspective:2000px;
    }



    .book{
      position:relative;
      width:350px;
      height:500px;
      transform-style:preserve-3d;
      transition:1s;
      animation:float 4s ease-in-out infinite;
    }

    .book:hover{
      transform:rotateY(-25deg);
    }

   

    .cover{
      position:absolute;
      width:100%;
      height:100%;
      background:
      linear-gradient(
      135deg,
      #00ffff,
      #2563eb,
      #7c3aed
      );

      border-radius:20px;
      transform-origin:left;
      transition:1s;
      box-shadow:
      0 0 40px cyan,
      0 0 80px rgba(0,255,255,.5);

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      z-index:10;
    }

    .book:hover .cover{
      transform:rotateY(-140deg);
    }

    

    .page{
      position:absolute;
      width:100%;
      height:100%;
      background:white;
      border-radius:20px;
      padding:40px;
      box-sizing:border-box;
      transform:translateZ(-5px);
      overflow:hidden;
    }

   

    .title{
      font-size:3rem;
      font-weight:900;
      color:white;
      text-shadow:0 0 20px cyan;
    }

    .subtitle{
      color:white;
      margin-top:10px;
      font-size:1.2rem;
      letter-spacing:2px;
    }

 

    .profile{
      width:120px;
      height:120px;
      border-radius:50%;
      border:5px solid white;
      margin-bottom:25px;
      object-fit:cover;
      box-shadow:0 0 25px white;
    }


    .socials{
      display:flex;
      gap:20px;
      margin-top:25px;
    }

    .socials i{
      font-size:1.7rem;
      color:white;
      transition:.3s;
      cursor:pointer;
    }

    .socials i:hover{
      transform:scale(1.2) rotate(10deg);
    }

 

    .inside-title{
      font-size:2.5rem;
      font-weight:800;
      color:#111827;
    }

    .inside-text{
      margin-top:20px;
      color:#4b5563;
      line-height:1.8;
      font-size:1rem;
    }

    .skills{
      display:flex;
      flex-wrap:wrap;
      gap:15px;
      margin-top:30px;
    }

    .skills span{
      background:#111827;
      color:white;
      padding:10px 18px;
      border-radius:50px;
      font-size:.9rem;
      box-shadow:0 0 15px rgba(0,0,0,.2);
    }

   

    @keyframes float{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-15px);
      }

      100%{
        transform:translateY(0px);
      }

    }

   

    @media(max-width:500px){

      .book{
        width:300px;
        height:450px;
      }

      .title{
        font-size:2.2rem;
      }

      .inside-title{
        font-size:2rem;
      }

    }

  </style>
</head>

<body>


  <div class="book">

    <div class="cover">

      <img
        src="aditi.jpeg"
        class="profile"
      >

      <h1 class="title">
       Aditi
      </h1>

      <p class="subtitle">
        FRONTEND DEVELOPER
      </p>

  
      <div class="socials">

        <i class="fa-brands fa-github"></i>

        <i class="fa-brands fa-linkedin"></i>

        <i class="fa-brands fa-instagram"></i>

      </div>

    </div>

    <div class="page">

      <h1 class="inside-title">
        About Me
      </h1>

      <p class="inside-text">

        Passionate frontend developer skilled in
        HTML, CSS, TailwindCSS and JavaScript.
        I create modern, responsive and animated
        UI designs with smooth user experience.

      </p>

   
      <div class="skills">

        <span>HTML</span>

        <span>CSS</span>

        <span>TailwindCSS</span>

        <span>JavaScript</span>

        <span>Responsive Design</span>

        <span>UI/UX</span>

      </div>

    </div>

  </div>

</body>
</html>
