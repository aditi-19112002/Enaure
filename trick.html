<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historical Places 3D Slider</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
height:100vh;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.slider{
position:relative;
width:1000px;
height:500px;
perspective:2000px;
}

.card{
position:absolute;
width:260px;
height:360px;
cursor:pointer;
transform-style:preserve-3d;
}

.card-inner{
position:relative;
width:100%;
height:100%;
transition:1s;
transform-style:preserve-3d;
}

.card.flip .card-inner{
transform:rotateY(180deg);
}

.front,
.back{
position:absolute;
width:100%;
height:100%;
border-radius:20px;
overflow:hidden;
backface-visibility:hidden;
box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.front img{
width:100%;
height:100%;
object-fit:cover;
}

.back{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
transform:rotateY(180deg);
}

.back h2{
margin-bottom:10px;
}

.controls{
position:absolute;
bottom:-80px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:20px;
}

button{
padding:12px 30px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
background:white;
font-weight:bold;
}

.title{
position:absolute;
top:-90px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:40px;
font-weight:bold;
letter-spacing:2px;
}

</style>
</head>
<body>

<div class="slider">

<div class="title">Historical Places</div>

<div class="card">
<div class="card-inner">
<div class="front">
<img src="https://images.unsplash.com/photo-1564507592333-c60657eea523">
</div>
<div class="back">
<h2>Taj Mahal</h2>
<p>Agra, India</p>
</div>
</div>
</div>

<div class="card">
<div class="card-inner">
<div class="front">
<img src="https://images.unsplash.com/photo-1552832230-c0197dd311b5">
</div>
<div class="back">
<h2>Colosseum</h2>
<p>Rome, Italy</p>
</div>
</div>
</div>

<div class="card">
<div class="card-inner">
<div class="front">
<img src="https://images.unsplash.com/photo-1526392060635-9d6019884377">
</div>
<div class="back">
<h2>Petra</h2>
<p>Jordan</p>
</div>
</div>
</div>

<div class="card">
<div class="card-inner">
<div class="front">
<img src="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9">
</div>
<div class="back">
<h2>Machu Picchu</h2>
<p>Peru</p>
</div>
</div>
</div>

<div class="card">
<div class="card-inner">
<div class="front">
<img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963">
</div>
<div class="back">
<h2>Hawa Mahal</h2>
<p>Jaipur, India</p>
</div>
</div>
</div>


<div class="controls">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>

</div>

<script>

const cards = document.querySelectorAll('.card');

let positions = [
{ x:-450, scale:.6, rot:-40 },
{ x:-250, scale:.8, rot:-20 },
{ x:0, scale:1.15, rot:0 },
{ x:250, scale:.8, rot:20 },
{ x:450, scale:.6, rot:40 },
{ x:650, scale:.4, rot:55 }
];

function render(){

cards.forEach((card,i)=>{

let p = positions[i];

gsap.to(card,{
x:p.x,
scale:p.scale,
rotationY:p.rot,
duration:1,
ease:"power3.out"
});

card.style.zIndex=Math.round(p.scale*100);

});
}

function next(){
positions.unshift(positions.pop());
render();
}

function prev(){
positions.push(positions.shift());
render();
}

render();

cards.forEach(card=>{

card.addEventListener('click',()=>{

card.classList.toggle('flip');

gsap.fromTo(
card,
{scale:1},
{
scale:1.25,
duration:.3,
yoyo:true,
repeat:1
}
);

});

});

</script>

</body>
</html>
