<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern 3D Carousel - 6 Cards</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
    overflow:hidden;
    font-family:sans-serif;
}

.carousel{
    position:relative;
    width:1000px;
    height:500px;
    perspective:1500px;
}

.card{
    position:absolute;
    left:50%;
    top:50%;
    width:280px;
    height:380px;
    border-radius:25px;
    overflow:hidden;
    transform-style:preserve-3d;
    transition:all .8s ease;
    box-shadow:0 25px 50px rgba(0,0,0,.4);
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.8),
        rgba(0,0,0,.1)
    );
}

.content{
    position:absolute;
    bottom:20px;
    left:20px;
    color:white;
}

.btn{
    position:absolute;
    bottom:-80px;
    left:50%;
    transform:translateX(-50%);
    padding:14px 32px;
    border:none;
    border-radius:999px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateX(-50%) scale(1.08);
}
</style>
</head>
<body>

<div class="carousel">

    <div class="card">
        <img src="https://picsum.photos/id/1015/600/800">
        <div class="overlay"></div>
        <div class="content">
            <h2 class="text-2xl font-bold">Mountain</h2>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/id/1016/600/800">
        <div class="overlay"></div>
        <div class="content">
            <h2 class="text-2xl font-bold">Forest</h2>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/id/1018/600/800">
        <div class="overlay"></div>
        <div class="content">
            <h2 class="text-2xl font-bold">Lake</h2>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/id/1020/600/800">
        <div class="overlay"></div>
        <div class="content">
            <h2 class="text-2xl font-bold">Ocean</h2>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/id/1024/600/800">
        <div class="overlay"></div>
        <div class="content">
            <h2 class="text-2xl font-bold">Nature</h2>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/id/1035/600/800">
        <div class="overlay"></div>
        <div class="content">
            <h2 class="text-2xl font-bold">Sunset</h2>
        </div>
    </div>

    <button id="nextBtn" class="btn">
        Next →
    </button>

</div>
<script>
const cards = document.querySelectorAll(".card");
let current = 0;

function updateCarousel(){

    cards.forEach((card,index)=>{

        let offset = index - current;

        if(offset < -3) offset += cards.length;
        if(offset > 3) offset -= cards.length;

        const x = offset * 170;
        const scale = 1 - Math.abs(offset) * 0.15;
        const rotateY = offset * -20;
        const opacity = 1 - Math.abs(offset) * 0.2;
        const zIndex = 10 - Math.abs(offset);

        card.style.transform = `
            translate(-50%, -50%)
            translateX(${x}px)
            scale(${scale})
            rotateY(${rotateY}deg)
        `;

        card.style.opacity = opacity;
        card.style.zIndex = zIndex;
    });
}

updateCarousel();

document.getElementById("nextBtn").addEventListener("click", () => {
    current = (current + 1) % cards.length;
    updateCarousel();
});
</script>
</body>
</html>
