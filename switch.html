<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Toggle Switch Theme</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:30px;
      padding:20px;
      transition:0.4s;
    }

    body.dark{
      background:#f1f5f9;
      color:#111;
    }

    h1{
      font-size:40px;
      text-align:center;
      margin-bottom:10px;
    }

    /* Toggle Switch */

    .toggle-wrapper{
      display:flex;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .switch{
      position:relative;
      width:70px;
      height:36px;
    }

    .switch input{
      opacity:0;
      width:0;
      height:0;
    }

    .slider{
      position:absolute;
      cursor:pointer;
      inset:0;
      background:#334155;
      border-radius:50px;
      transition:0.4s;
    }

    .slider::before{
      content:"";
      position:absolute;
      width:28px;
      height:28px;
      left:4px;
      top:4px;
      background:white;
      border-radius:50%;
      transition:0.4s;
    }

    input:checked + .slider{
      background:#22c55e;
    }

    input:checked + .slider::before{
      transform:translateX(34px);
    }

    /* Code Box */

    .code-box{
      width:50%;
      max-width:550px;
      background:#111827;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    .code-top{
      background:#1e293b;
      padding:14px 20px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
    }

    .red{
      background:#ef4444;
    }

    .yellow{
      background:#facc15;
    }

    .green{
      background:#22c55e;
    }

    .title{
      margin-left:auto;
      color:#cbd5e1;
      font-size:14px;
      letter-spacing:1px;
    }

    pre{
      padding:25px;
      overflow-x:auto;
      line-height:1.8;
      font-size:15px;
      color:white;
    }

    .pink{
      color:#ff79c6;
    }

    .blue{
      color:#60a5fa;
    }

    .greenText{
      color:#4ade80;
    }

    .purple{
      color:#c084fc;
    }

    @media(max-width:600px){

      h1{
        font-size:28px;
      }

      pre{
        font-size:13px;
        padding:18px;
      }

      .switch{
        width:60px;
        height:32px;
      }

      .slider::before{
        width:24px;
        height:24px;
      }

      input:checked + .slider::before{
        transform:translateX(28px);
      }

    }

  </style>
</head>

<body>

  <h1>Toggle Switch Theme</h1>

  <div class="toggle-wrapper">

    <span>Light</span>

    <label class="switch">

      <input type="checkbox" id="checkbox">

      <span class="slider"></span>

    </label>

    <span>Dark</span>

  </div>

  <div class="code-box">

    <div class="code-top">

      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>

      <div class="title">CSS</div>

    </div>

<pre>
<span class="pink">&lt;script&gt;</span>

 const checkbox = document.
 <span class="blue">getElementById</span>(
 <span class="greenText">"checkbox"</span>)

 checkbox.<span class="blue">addEventListener</span>(
 <span class="greenText">"change"</span>,

 <span class="purple">() =&gt;</span> {

 document.body.classList.
 <span class="blue">toggle</span>(
 <span class="greenText">"dark-mode"</span>)

 })

<span class="pink">&lt;/script&gt;</span>
</pre>

  </div>

  <script>

    const checkbox = document.getElementById("checkbox");

    checkbox.addEventListener("change", () => {

      document.body.classList.toggle("dark");

    });

  </script>

</body>
</html>
