<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>T-Shirt Interactive Card</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body class="h-screen grid place-items-center bg-slate-100">


<div class="w-80 bg-white rounded-3xl shadow-2xl p-5">


<!-- T-Shirt Image -->

<div class="relative">

<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
class="w-full h-72 object-cover rounded-2xl">


<span class="absolute top-3 right-3 bg-black text-white px-3 py-1 rounded-full text-sm">
NEW
</span>

</div>



<h2 class="text-2xl font-bold mt-4">
Oversized T-Shirt
</h2>


<p class="text-gray-500">
Premium Cotton • Black
</p>



<div class="flex justify-between items-center mt-3">

<h3 class="text-2xl font-bold">
₹799
</h3>


<div class="text-yellow-400">
★★★★★
</div>

</div>




<!-- Morphing Button -->

<div id="box"
class="mt-5 h-14 bg-blue-600 rounded-full shadow-lg flex items-center px-5 cursor-pointer hover:scale-105 transition">


<i id="icon"
class="fa-solid fa-cart-shopping text-white">
</i>


<div id="content"
class="flex-1 text-center text-white font-bold">

Buy Now

</div>


<i id="arrow"
class="fa-solid fa-arrow-right text-white hidden">
</i>


</div>


</div>




<script>


let box=document.querySelector("#box");
let content=document.querySelector("#content");
let icon=document.querySelector("#icon");
let arrow=document.querySelector("#arrow");


let step=0;


box.onclick=()=>{


if(step===0){


content.innerHTML=`

<div class="flex items-center justify-center gap-2">

<img 
src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
class="w-10 h-10 rounded-full object-cover">


<div class="text-left text-sm">

<p>
Black Oversized T-Shirt
</p>

<p class="text-yellow-300">
₹799
</p>

</div>


</div>

`;


icon.className=
"fa-solid fa-shirt text-white";


arrow.classList.remove("hidden");


step++;


}


else if(step===1){


content.innerHTML="Confirm Order";


icon.className=
"fa-solid fa-check text-white";


step++;


}


else{


content.innerHTML="Processing...";

icon.className=
"fa-solid fa-spinner fa-spin text-white";


arrow.classList.add("hidden");


setTimeout(()=>{


box.className=
"mt-5 h-14 bg-green-500 rounded-full flex items-center justify-center gap-3 text-white font-bold";


box.innerHTML=
`

<i class="fa-solid fa-circle-check"></i>

Order Confirmed ❤️

`;

},1500);


}



}


</script>


</body>

</html>
