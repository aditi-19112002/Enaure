<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Buttons</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
background:radial-gradient(circle at top,#1e293b,#020617);
overflow:hidden;
}

.btn{
transition:.4s;
position:relative;
overflow:hidden;
}

.btn:hover{
transform:translateY(-6px) scale(1.05);
box-shadow:0 0 30px rgba(255,255,255,.25);
}

.bird{
position:absolute;
font-size:26px;
transition:1.5s linear;
pointer-events:none;
}

.progress{
height:6px;
width:0%;
transition:.1s;
}
</style>

</head>
<body class="h-screen flex items-center justify-center">

<div class="grid md:grid-cols-2 gap-8">

<button id="signup" class="btn w-56 h-16 rounded-full bg-violet-600 text-white text-xl font-bold shadow-xl">
👤 Sign Up
</button>

<button id="login" class="btn w-56 h-16 rounded-full bg-sky-600 text-white text-xl font-bold shadow-xl">
🔒 Login
</button>

<button id="send" class="btn w-56 h-16 rounded-full bg-emerald-600 text-white text-xl font-bold shadow-xl">
🕊 Send
</button>

<div class="relative">
<button id="download" class="btn w-56 h-16 rounded-full bg-amber-500 text-white text-xl font-bold shadow-xl">
⬇ Download
</button>

<div id="bar" class="progress absolute bottom-0 left-0 bg-white rounded-full"></div>
</div>

</div>

<div id="bird" class="bird hidden">🕊</div>

<script>


signup.onclick=()=>{
signup.innerHTML="⏳ Creating...";
setTimeout(()=>{
signup.classList.replace("bg-violet-600","bg-green-600");
signup.innerHTML="✅ Created";
},1200);
}

// Login
login.onclick=()=>{
login.innerHTML="🔄 Checking...";
setTimeout(()=>{
login.classList.replace("bg-sky-600","bg-green-600");
login.innerHTML="🔓 Welcome";
},1200);
}


send.onclick=()=>{

bird.classList.remove("hidden");

bird.style.left=send.offsetLeft+90+"px";
bird.style.top=send.offsetTop+10+"px";

setTimeout(()=>{
bird.style.transform="translate(500px,-180px) rotate(-20deg)";
},50);

setTimeout(()=>{
bird.classList.add("hidden");
bird.style.transform="translate(0,0)";
send.classList.replace("bg-emerald-600","bg-green-600");
send.innerHTML="✅ Sent";
},1700);

}

download.onclick=()=>{

let i=0;

let x=setInterval(()=>{

i++;

download.innerHTML="⬇ "+i+"%";

bar.style.width=i+"%";

if(i==100){

clearInterval(x);

download.classList.replace("bg-amber-500","bg-green-600");

download.innerHTML="✔ Downloaded";

}

},25);

}

</script>

</body>
</html>
