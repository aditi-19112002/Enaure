<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admission Form</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      overflow-x:hidden;
    }

    .glass{
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      border:1px solid rgba(255,255,255,0.15);
      box-shadow:0 0 30px rgba(0,0,0,0.2);
    }

    .input-box{
      transition:0.3s;
    }

    .input-box:focus{
      transform:scale(1.02);
      box-shadow:0 0 15px rgba(99,102,241,0.5);
    }

    .floating{
      animation:float 5s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-15px);
      }
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-950 via-black to-purple-900 flex items-center justify-center p-6">

  <!-- Background Glow -->
  <div class="absolute w-72 h-72 bg-pink-500 rounded-full blur-[120px] opacity-30 top-10 left-10 floating"></div>

  <div class="absolute w-72 h-72 bg-blue-500 rounded-full blur-[120px] opacity-30 bottom-10 right-10 floating"></div>

  <!-- Form Container -->
  <div class="glass w-full max-w-4xl rounded-3xl p-8 md:p-12 relative z-10">

    <div class="text-center mb-10">

      <h1 class="text-4xl md:text-5xl font-bold text-white mb-3">
        Admission Form
      </h1>

      <p class="text-gray-300">
        Fill your details for admission
      </p>

    </div>

    <form id="admissionForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Full Name -->
      <div>
        <label class="text-white block mb-2">
          Full Name
        </label>

        <input
          type="text"
          placeholder="Enter your name"
          class="input-box w-full p-4 rounded-2xl bg-white/10 text-white outline-none"
          required
        >
      </div>

      <!-- Email -->
      <div>
        <label class="text-white block mb-2">
          Email Address
        </label>

        <input
          type="email"
          placeholder="Enter your email"
          class="input-box w-full p-4 rounded-2xl bg-white/10 text-white outline-none"
          required
        >
      </div>

      <!-- Phone -->
      <div>
        <label class="text-white block mb-2">
          Phone Number
        </label>

        <input
          type="tel"
          placeholder="Enter phone number"
          class="input-box w-full p-4 rounded-2xl bg-white/10 text-white outline-none"
          required
        >
      </div>

      <!-- Course -->
      <div>
        <label class="text-white block mb-2">
          Select Course
        </label>

        <select
          class="input-box w-full p-4 rounded-2xl bg-white/10 text-white outline-none"
          required
        >
          <option class="text-black">Web Development</option>
          <option class="text-black">JavaScript</option>
          <option class="text-black">Python</option>
          <option class="text-black">UI/UX Design</option>
        </select>
      </div>

      <!-- DOB -->
      <div>
        <label class="text-white block mb-2">
          Date of Birth
        </label>

        <input
          type="date"
          class="input-box w-full p-4 rounded-2xl bg-white/10 text-white outline-none"
          required
        >
      </div>

      <!-- Gender -->
      <div>
        <label class="text-white block mb-2">
          Gender
        </label>

        <select
          class="input-box w-full p-4 rounded-2xl bg-white/10 text-white outline-none"
          required
        >
          <option class="text-black">Male</option>
          <option class="text-black">Female</option>
          <option class="text-black">Other</option>
        </select>
      </div>

      <!-- Address -->
      <div class="md:col-span-2">
        <label class="text-white block mb-2">
          Address
        </label>

        <textarea
          rows="4"
          placeholder="Enter your address"
          class="input-box w-full p-4 rounded-2xl bg-white/10 text-white outline-none resize-none"
          required
        ></textarea>
      </div>

      <!-- Submit -->
      <div class="md:col-span-2 text-center mt-4">

        <button
          type="submit"
          class="px-10 py-4 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 text-white text-lg font-semibold hover:scale-105 transition duration-300 shadow-lg shadow-pink-500/40"
        >
          Submit Admission
        </button>

      </div>

    </form>

  </div>

  <script>

    const form = document.getElementById("admissionForm");

    form.addEventListener("submit", function(e){

      e.preventDefault();

      alert(" Admission Form Submitted Successfully!");

      form.reset();

    });

  </script>

</body>
</html>
