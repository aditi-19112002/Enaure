<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup Form</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-black via-gray-900 to-white flex items-center justify-center p-4">

  <div class="w-full max-w-6xl bg-white rounded-3xl overflow-hidden shadow-2xl grid md:grid-cols-2">

   
    <div class="relative hidden md:block">

     
      <img
        src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop"
        class="absolute inset-0 w-full h-full object-cover"
      />

     
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>

      <div class="relative z-10 h-full flex flex-col justify-end p-12 text-white">

        <span class="bg-white/20 backdrop-blur-md px-5 py-2 rounded-full w-fit text-sm mb-5">
          Welcome to Future UI
        </span>

        <h1 class="text-5xl font-bold leading-tight">
          Build Your <br>
          Dream Account
        </h1>

        <p class="mt-5 text-white/80 text-lg leading-relaxed">
          Experience modern dashboard design with responsive TailwindCSS components and stylish UI effects.
        </p>

     
        <div class="flex gap-4 mt-8">

          <div class="bg-white/20 backdrop-blur-md p-4 rounded-2xl w-28">
            <h2 class="text-2xl font-bold">10K+</h2>
            <p class="text-sm text-white/70">Users</p>
          </div>

          <div class="bg-white/20 backdrop-blur-md p-4 rounded-2xl w-28">
            <h2 class="text-2xl font-bold">4.9★</h2>
            <p class="text-sm text-white/70">Rating</p>
          </div>

        </div>
      </div>
    </div>

  <div class="p-8 md:p-14 bg-black text-white">

  
  <div class="text-center">
    <h2 class="text-4xl font-bold">
      Create Account
    </h2>

    <p class="text-gray-400 mt-2">
      Signup to continue your journey
    </p>
  </div>

  
  <form class="mt-10 space-y-5">

    <div>
      <label class="text-sm font-semibold text-gray-300">
        Full Name
      </label>

      <input
        type="text"
        placeholder="Enter your full name"
        class="w-full mt-2 px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-gray-500 outline-none transition"
      />
    </div>


    <div>
      <label class="text-sm font-semibold text-gray-300">
        Email Address
      </label>

      <input
        type="email"
        placeholder="Enter your email"
        class="w-full mt-2 px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-gray-500 outline-none transition"
      />
    </div>

   
    <div>
      <label class="text-sm font-semibold text-gray-300">
        Password
      </label>

      <input
        type="password"
        placeholder="Enter password"
        class="w-full mt-2 px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-gray-500 outline-none transition"
      />
    </div>

    <div>
      <label class="text-sm font-semibold text-gray-300">
        Confirm Password
      </label>

      <input
        type="password"
        placeholder="Confirm password"
        class="w-full mt-2 px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-gray-500 outline-none transition"
      />
    </div>

    <div class="flex items-center gap-3">
      <input type="checkbox" class="w-5 h-5 accent-gray-500">

      <p class="text-sm text-gray-400">
        I agree to Terms & Conditions
      </p>
    </div>

    <button
      class="w-full py-3 rounded-xl bg-gradient-to-r from-black via-gray-800 to-gray-500 text-white font-semibold text-lg hover:scale-[1.02] transition duration-300 shadow-lg"
    >
      Create Account
    </button>

  </form>

  <div class="flex items-center gap-4 my-8">
    <div class="flex-1 h-[1px] bg-gray-700"></div>
    <p class="text-gray-500 text-sm">OR</p>
    <div class="flex-1 h-[1px] bg-gray-700"></div>
  </div>

  <div class="grid grid-cols-2 gap-4">

    <button class="border border-gray-700 bg-gray-900 py-3 rounded-xl hover:bg-gray-800 transition font-medium">
      Google
    </button>

    <button class="border border-gray-700 bg-gray-900 py-3 rounded-xl hover:bg-gray-800 transition font-medium">
      GitHub
    </button>

  </div>

  <p class="text-center text-gray-400 mt-8">
    Already have an account?
    <a href="#" class="text-white font-semibold hover:underline">
      Login
    </a>
  </p>

</div>
  </div>

</body>
</html>
