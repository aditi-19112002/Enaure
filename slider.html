<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSAP Image Slider</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f0f0f;
  overflow: hidden;
}

.slider {
  position: relative;
  width: 600px;
  height: 350px;
  perspective: 1000px;
}

.card {
  position: absolute;
  width: 200px;
  height: 300px;
  border-radius: 20px;
  overflow: hidden;
  transition: 0.5s;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.controls {
  position: absolute;
  bottom: -70px;
  display: flex;
  gap: 20px;
}

button {
  padding: 10px 20px;
  border: none;
  background: white;
  cursor: pointer;
  border-radius: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="slider" id="slider">

  <div class="card"><img src="https://picsum.photos/id/1015/500/700"></div>
  <div class="card"><img src="https://picsum.photos/id/1016/500/700"></div>
  <div class="card"><img src="https://picsum.photos/id/1018/500/700"></div>
  <div class="card"><img src="https://picsum.photos/id/1020/500/700"></div>
  <div class="card"><img src="https://picsum.photos/id/1024/500/700"></div>
  <div class="card"><img src="https://picsum.photos/id/1035/500/700"></div>

  <div class="controls">
    <button onclick="prev()">Prev</button>
    <button onclick="next()">Next</button>
  </div>

</div>

<script>
const cards = document.querySelectorAll(".card");

let positions = [
  { x: -300, scale: 0.7, z: -200, rot: -15 },
  { x: -150, scale: 0.85, z: -100, rot: -8 },
  { x: 0, scale: 1, z: 0, rot: 0 },
  { x: 150, scale: 0.85, z: -100, rot: 8 },
  { x: 300, scale: 0.7, z: -200, rot: 15 },
  { x: 450, scale: 0.5, z: -300, rot: 20 }
];

function render() {
  cards.forEach((card, i) => {
    let p = positions[i];

    gsap.to(card, {
      x: p.x,
      scale: p.scale,
      z: p.z,
      rotationY: p.rot,
      duration: 0.8,
      ease: "power3.out"
    });

    card.style.zIndex = Math.round(p.scale * 10);
  });
}

function next() {
  positions.unshift(positions.pop());
  render();
}

function prev() {
  positions.push(positions.shift());
  render();
}

render();
</script>

</body>
</html>
