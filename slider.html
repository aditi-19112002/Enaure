<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caveman Destroys Error</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(to top,#4a3728,#111);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

/* Ground */
.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:150px;
    background:#3a291c;
}

/* Stone */
.stone{
    width:320px;
    height:220px;
    background:#777;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:70px;
    font-weight:bold;
    color:white;
    position:relative;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
    transition:.3s;
}

.crack{
    position:absolute;
    background:#222;
    border-radius:10px;
    opacity:0;
}

.crack1{
    width:6px;
    height:100px;
    transform:rotate(20deg);
}

.crack2{
    width:6px;
    height:130px;
    transform:rotate(-30deg);
}

.crack3{
    width:6px;
    height:120px;
    transform:rotate(60deg);
}

/* Caveman */
.caveman{
    position:absolute;
    left:-250px;
    bottom:120px;
    font-size:120px;
    animation:walk 4s forwards;
}

@keyframes walk{
    to{
        left:18%;
    }
}

/* Club */
.club{
    position:absolute;
    right:-30px;
    top:40px;
    font-size:60px;
    transform-origin:left center;
}

.hit{
    animation:swing .4s;
}

@keyframes swing{
    0%{transform:rotate(0deg);}
    50%{transform:rotate(-80deg);}
    100%{transform:rotate(0deg);}
}

/* Shake */
.shake{
    animation:shake .3s;
}

@keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    50%{transform:translateX(8px);}
    75%{transform:translateX(-8px);}
}

/* Dust */
.dust{
    position:absolute;
    width:15px;
    height:15px;
    background:#ccc;
    border-radius:50%;
    opacity:0;
}

.boom{
    animation:explode 1.2s forwards;
}

@keyframes explode{
    from{
        opacity:1;
        transform:translate(0,0) scale(1);
    }
    to{
        opacity:0;
        transform:
        translate(
            calc(-200px + 400px * var(--x)),
            calc(-150px + 300px * var(--y))
        )
        scale(0);
    }
}

/* Success */
.success{
    position:absolute;
    color:#00ff88;
    font-size:60px;
    font-weight:bold;
    opacity:0;
    text-align:center;
}

.show{
    animation:showText 1s forwards;
}

@keyframes showText{
    from{
        opacity:0;
        transform:scale(.3);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}
</style>
</head>
<body>

<div class="ground"></div>

<div class="stone" id="stone">
    ERROR

    <div class="crack crack1" id="c1"></div>
    <div class="crack crack2" id="c2"></div>
    <div class="crack crack3" id="c3"></div>
</div>

<div class="success" id="success">
    ERROR DESTROYED ✅
</div>

<div class="caveman" id="caveman">
    🧔
    <div class="club" id="club">🏏</div>
</div>

<script>
const club = document.getElementById("club");
const stone = document.getElementById("stone");

setTimeout(()=>{
    hitStone(1);
},4500);

function hitStone(step){

    club.classList.add("hit");
    stone.classList.add("shake");

    setTimeout(()=>{
        club.classList.remove("hit");
        stone.classList.remove("shake");
    },400);

    if(step===1){
        document.getElementById("c1").style.opacity=1;

        setTimeout(()=>{
            hitStone(2);
        },900);
    }

    else if(step===2){
        document.getElementById("c2").style.opacity=1;

        setTimeout(()=>{
            hitStone(3);
        },900);
    }

    else if(step===3){
        document.getElementById("c3").style.opacity=1;

        setTimeout(()=>{
            destroyStone();
        },900);
    }
}

function destroyStone(){

    stone.style.opacity="0";

    for(let i=0;i<40;i++){

        let dust=document.createElement("div");
        dust.className="dust boom";

        dust.style.left="50%";
        dust.style.top="50%";

        dust.style.setProperty("--x",Math.random());
        dust.style.setProperty("--y",Math.random());

        document.body.appendChild(dust);

        setTimeout(()=>{
            dust.remove();
        },1200);
    }

    document
    .getElementById("success")
    .classList
    .add("show");
}
</script>

</body>
</html>
