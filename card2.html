<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>

  <title>CRUD</title>
</head>

<body class="bg-gradient-to-br from-slate-900 to-black min-h-screen p-6 text-white">

  <h1 class="text-5xl font-bold text-center mb-12 tracking-wide">
    CRUD OPERATIONS 
  </h1>

  <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-8 items-start justify-center">


    <div class="w-full lg:w-[380px] bg-white/10 backdrop-blur-lg p-8 rounded-3xl shadow-2xl">

      <h2 class="text-3xl font-bold mb-6 text-center">
        Add User
      </h2>

      <div class="space-y-5">

        <input
          type="text"
          id="name"
          placeholder="Enter Name"
          class="w-full px-4 py-4 rounded-xl bg-white/20 outline-none border border-white/10 focus:border-blue-400"
        >

        <input
          type="email"
          id="email"
          placeholder="Enter Email"
          class="w-full px-4 py-4 rounded-xl bg-white/20 outline-none border border-white/10 focus:border-blue-400"
        >

        <button
          onclick="saveData()"
          class="w-full bg-blue-500 py-4 rounded-xl font-bold hover:scale-105 transition duration-300"
        >
          Save Data
        </button>

      </div>

    </div>

    <div class="w-full lg:w-[500px] overflow-x-auto bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl">

      <table class="w-full text-left">

        <thead class="bg-white/20">

          <tr>
            <th class="p-5">ID</th>
            <th class="p-5">Name</th>
            <th class="p-5">Email</th>
            <th class="p-5 text-center">Actions</th>
          </tr>

        </thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>

  </div>

  <script>

    let users = [];
    let editIndex = null;

    function saveData() {

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;

      if(name === "" || email === "") {
        alert("Please fill all fields");
        return;
      }

      if(editIndex === null) {

        users.push({
          name,
          email
        });

      } else {

        users[editIndex] = {
          name,
          email
        };

        editIndex = null;

      }

      document.getElementById("name").value = "";
      document.getElementById("email").value = "";

      showData();

    }

    function showData() {

      const tableBody = document.getElementById("tableBody");

      tableBody.innerHTML = "";

      users.forEach((user, index) => {

        tableBody.innerHTML += `
        
          <tr class="border-b border-white/10 hover:bg-white/10 transition duration-300">

            <td class="p-5">${index + 1}</td>

            <td class="p-5">${user.name}</td>

            <td class="p-5">${user.email}</td>

            <td class="p-5">

              <div class="flex justify-center gap-3">

                <button
                  onclick="editData(${index})"
                  class="bg-yellow-500 px-4 py-2 rounded-lg hover:scale-105 transition duration-300"
                >
                  Edit
                </button>

                <button
                  onclick="deleteData(${index})"
                  class="bg-red-500 px-4 py-2 rounded-lg hover:scale-105 transition duration-300"
                >
                  Delete
                </button>

              </div>

            </td>

          </tr>

        `;

      });

    }

    function editData(index) {

      document.getElementById("name").value =
        users[index].name;

      document.getElementById("email").value =
        users[index].email;

      editIndex = index;

    }

    function deleteData(index) {

      users.splice(index, 1);

      showData();

    }

  </script>

</body>
</html>
