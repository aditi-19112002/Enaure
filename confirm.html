<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script src="https://cdn.tailwindcss.com"></script>

 
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <title>Enaure Footer</title>
</head>

<body class="bg-gray-100">

    
  <section class="bg-[#f7f7f7] py-14">
    <div class="max-w-7xl mx-auto px-6">

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">

        <!-- Box 1 -->
        <div class="border border-dashed border-gray-300 rounded-lg p-8 text-center bg-white relative">
          <div class="absolute -top-5 left-1/2 -translate-x-1/2 bg-[#f7f7f7] px-4">
            <i class="fa-solid fa-headphones text-3xl text-yellow-600"></i>
          </div>

          <h2 class="text-2xl font-bold text-gray-900 mt-4">
            24/7 SUPPORT
          </h2>

          <p class="text-gray-500 mt-3 leading-7">
            24/7 Support From Our Dedicated Team
          </p>
        </div>

        <!-- Box 2 -->
        <div class="border border-dashed border-gray-300 rounded-lg p-8 text-center bg-white relative">
          <div class="absolute -top-5 left-1/2 -translate-x-1/2 bg-[#f7f7f7] px-4">
            <i class="fa-solid fa-truck text-3xl text-yellow-600"></i>
          </div>

          <h2 class="text-2xl font-bold text-gray-900 mt-4">
            FREE SHIPPING
          </h2>

          <p class="text-gray-500 mt-3 leading-7">
            Free Shipping for All Domestic Orders.
          </p>
        </div>

        <!-- Box 3 -->
        <div class="border border-dashed border-gray-300 rounded-lg p-8 text-center bg-white relative">
          <div class="absolute -top-5 left-1/2 -translate-x-1/2 bg-[#f7f7f7] px-4">
            <i class="fa-solid fa-tag text-3xl text-yellow-600"></i>
          </div>

          <h2 class="text-2xl font-bold text-gray-900 mt-4">
            BEST PRICE
          </h2>

          <p class="text-gray-500 mt-3 leading-7">
            Get Assured Product From The Enaure Jewellery.
          </p>
        </div>

        <!-- Box 4 -->
        <div class="border border-dashed border-gray-300 rounded-lg p-8 text-center bg-white relative">
          <div class="absolute -top-5 left-1/2 -translate-x-1/2 bg-[#f7f7f7] px-4">
            <i class="fa-solid fa-shield-halved text-3xl text-yellow-600"></i>
          </div>

          <h2 class="text-2xl font-bold text-gray-900 mt-4">
            100% SAFE PAYMENT
          </h2>

          <p class="text-gray-500 mt-3 leading-7">
            100% Secure Payment With SSL Certificate
          </p>
        </div>

      </div>
    </div>
  </section>


 

</body>
</html>
