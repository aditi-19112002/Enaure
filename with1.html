<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    background: linear-gradient(135deg,#0f172a,#1e293b);
}
.glass{
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>
<body class="min-h-screen text-white p-6">

<div class="max-w-6xl mx-auto">

    <h1 class="text-4xl font-bold text-center mb-8">
         Expense Tracker
    </h1>

    <!-- Stats -->
    <div class="grid md:grid-cols-3 gap-5 mb-8">
        <div class="glass rounded-2xl p-5 text-center">
            <h2 class="text-gray-300">Income</h2>
            <p id="income" class="text-3xl font-bold text-green-400">₹0</p>
        </div>

        <div class="glass rounded-2xl p-5 text-center">
            <h2 class="text-gray-300">Expense</h2>
            <p id="expense" class="text-3xl font-bold text-red-400">₹0</p>
        </div>

        <div class="glass rounded-2xl p-5 text-center">
            <h2 class="text-gray-300">Balance</h2>
            <p id="balance" class="text-3xl font-bold text-cyan-400">₹0</p>
        </div>
    </div>

    <div class="grid lg:grid-cols-2 gap-8">

        <!-- Form -->
        <div class="glass p-6 rounded-2xl">
            <h2 class="text-2xl font-bold mb-4">
                Add Transaction
            </h2>

            <form id="transactionForm" class="space-y-4">
                <input
                    type="text"
                    id="title"
                    placeholder="Transaction Name"
                    class="w-full p-3 rounded-xl bg-slate-800 outline-none"
                    required
                >

                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    class="w-full p-3 rounded-xl bg-slate-800 outline-none"
                    required
                >

                <select
                    id="type"
                    class="w-full p-3 rounded-xl bg-slate-800 outline-none"
                >
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <button
                    class="w-full bg-cyan-500 hover:bg-cyan-600 py-3 rounded-xl font-bold transition"
                >
                    Add Transaction
                </button>
            </form>

            <div class="mt-8">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- Transaction List -->
        <div class="glass p-6 rounded-2xl">
            <h2 class="text-2xl font-bold mb-4">
                Transactions
            </h2>

            <div id="transactionList" class="space-y-3">
            </div>
        </div>

    </div>
</div>

<script>
const form = document.getElementById("transactionForm");
const transactionList = document.getElementById("transactionList");

let transactions =
JSON.parse(localStorage.getItem("transactions")) || [];

const incomeEl = document.getElementById("income");
const expenseEl = document.getElementById("expense");
const balanceEl = document.getElementById("balance");

const ctx = document.getElementById("expenseChart");

const chart = new Chart(ctx, {
    type: "doughnut",
    data: {
        labels: ["Income", "Expense"],
        datasets: [{
            data: [0,0],
            backgroundColor: [
                "#22c55e",
                "#ef4444"
            ]
        }]
    }
});

function saveData(){
    localStorage.setItem(
        "transactions",
        JSON.stringify(transactions)
    );
}

function deleteTransaction(id){
    transactions =
    transactions.filter(item => item.id !== id);

    saveData();
    updateUI();
}

function updateUI(){

    transactionList.innerHTML = "";

    let income = 0;
    let expense = 0;

    transactions.forEach(item => {

        if(item.type === "income"){
            income += item.amount;
        }else{
            expense += item.amount;
        }

        const div = document.createElement("div");

        div.className =
        `flex justify-between items-center p-4 rounded-xl ${
            item.type === "income"
            ? "bg-green-500/20"
            : "bg-red-500/20"
        }`;

        div.innerHTML = `
            <div>
                <h3 class="font-bold">${item.title}</h3>
                <p class="text-sm text-gray-300">
                    ₹${item.amount}
                </p>
            </div>

            <button
            onclick="deleteTransaction(${item.id})"
            class="bg-red-500 px-3 py-1 rounded-lg">
            Delete
            </button>
        `;

        transactionList.appendChild(div);
    });

    const balance = income - expense;

    incomeEl.textContent = `₹${income}`;
    expenseEl.textContent = `₹${expense}`;
    balanceEl.textContent = `₹${balance}`;

    chart.data.datasets[0].data = [
        income,
        expense
    ];

    chart.update();
}

form.addEventListener("submit", e => {
    e.preventDefault();

    const title =
    document.getElementById("title").value;

    const amount =
    Number(document.getElementById("amount").value);

    const type =
    document.getElementById("type").value;

    transactions.push({
        id: Date.now(),
        title,
        amount,
        type
    });

    saveData();
    updateUI();

    form.reset();
});

updateUI();
</script>

</body>
</html>
