<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Card Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
}

.container{
    text-align:center;
    color:white;
}

h1{
    margin-bottom:15px;
}

.stats{
    display:flex;
    justify-content:space-between;
    width:400px;
    margin:0 auto 20px;
    font-size:20px;
    font-weight:bold;
}

.game{
    width:420px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.card{
    width:95px;
    height:95px;
    background:#334155;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    transform-style:preserve-3d;
    transition:0.4s;
}

.card.flip{
    background:#22c55e;
}

.card.matched{
    background:#f59e0b;
    pointer-events:none;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>
<body>

<div class="container">
    <h1>Memory Card Game</h1>

    <div class="stats">
        <span>⏱️ Time: <span id="time">0</span>s</span>
        <span>⭐ Score: <span id="score">0</span></span>
    </div>

    <div class="game" id="game"></div>

    <button onclick="restartGame()">Restart Game</button>
</div>

<script>
const game = document.getElementById("game");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");

let emojis = ["🍕","🍔","🍎","🍇","🚗","✈️","⚽","🎮"];
let cards = [...emojis,...emojis];

let firstCard = null;
let secondCard = null;
let lockBoard = false;
let score = 0;
let time = 0;
let matchedPairs = 0;
let timer;

function shuffle(array){
    array.sort(()=>Math.random()-0.5);
}

function startTimer(){
    clearInterval(timer);
    time = 0;
    timer = setInterval(()=>{
        time++;
        timeEl.textContent = time;
    },1000);
}

function createBoard(){

    game.innerHTML = "";
    shuffle(cards);

    cards.forEach(emoji=>{

        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.emoji = emoji;
        card.textContent = "";

        card.addEventListener("click",flipCard);

        game.appendChild(card);
    });
}

function flipCard(){

    if(lockBoard) return;
    if(this === firstCard) return;

    this.classList.add("flip");
    this.textContent = this.dataset.emoji;

    if(!firstCard){
        firstCard = this;
        return;
    }

    secondCard = this;
    checkMatch();
}

function checkMatch(){

    let isMatch =
    firstCard.dataset.emoji === secondCard.dataset.emoji;

    if(isMatch){

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        score += 10;
        matchedPairs++;

        scoreEl.textContent = score;

        resetTurn();

        if(matchedPairs === emojis.length){

            clearInterval(timer);

            setTimeout(()=>{
                alert(
                  `🎉 You Won!\nScore: ${score}\nTime: ${time}s`
                );
            },300);
        }

    }else{

        lockBoard = true;

        setTimeout(()=>{

            firstCard.classList.remove("flip");
            secondCard.classList.remove("flip");

            firstCard.textContent = "";
            secondCard.textContent = "";

            resetTurn();

        },800);
    }
}

function resetTurn(){
    [firstCard,secondCard] = [null,null];
    lockBoard = false;
}

function restartGame(){

    score = 0;
    matchedPairs = 0;

    scoreEl.textContent = score;

    createBoard();
    startTimer();
}

createBoard();
startTimer();
</script>

</body>
</html>
