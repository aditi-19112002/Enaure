<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tablet Cart UI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-6xl mx-auto p-4">

  <!-- HEADER -->
  <h1 class="text-2xl font-bold mb-4">Shopping Store 🛍️</h1>

  <!-- MAIN LAYOUT (Tablet Friendly) -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

    <!-- PRODUCTS (2/3 width on tablet) -->
    <div class="md:col-span-2 space-y-4">

      <h2 class="text-lg font-semibold">Products</h2>

      <!-- Product Card -->
      <div class="bg-white p-3 rounded-xl shadow flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38"
               class="w-14 h-14 rounded object-cover">

          <div>
            <p class="font-semibold">Hoodie</p>
            <p class="text-sm text-gray-500">₹799</p>
          </div>
        </div>

        <button onclick="addToCart('Hoodie',799,'https://images.unsplash.com/photo-1520975916090-3105956dac38')"
          class="bg-black text-white px-3 py-1 rounded-lg text-sm">
          Add
        </button>
      </div>

      <div class="bg-white p-3 rounded-xl shadow flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f"
               class="w-14 h-14 rounded object-cover">

          <div>
            <p class="font-semibold">Shoes</p>
            <p class="text-sm text-gray-500">₹1299</p>
          </div>
        </div>

        <button onclick="addToCart('Shoes',1299,'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f')"
          class="bg-black text-white px-3 py-1 rounded-lg text-sm">
          Add
        </button>
      </div>

    </div>

    <!-- CART (1/3 width on tablet) -->
    <div class="bg-white p-4 rounded-xl shadow h-fit">

      <h2 class="text-lg font-semibold mb-3">Cart 🛒</h2>

      <div id="cartItems" class="space-y-2"></div>

      <hr class="my-3">

      <p class="font-bold">Total: ₹<span id="total">0</span></p>

    </div>

  </div>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, price, image){

  let item = cart.find(i => i.name === name);

  if(item){
    item.qty++;
  } else {
    cart.push({name, price, image, qty:1});
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function removeItem(index){
  cart.splice(index,1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function renderCart(){

  let container = document.getElementById("cartItems");
  container.innerHTML = "";

  let total = 0;

  cart.forEach((item, index) => {

    total += item.price * item.qty;

    container.innerHTML += `
      <div class="flex items-center justify-between bg-gray-100 p-2 rounded">

        <div class="flex items-center gap-2">
          <img src="${item.image}" class="w-10 h-10 rounded object-cover">
          <div>
            <p class="text-sm font-semibold">${item.name}</p>
            <p class="text-xs text-gray-600">₹${item.price} × ${item.qty}</p>
          </div>
        </div>

        <button onclick="removeItem(${index})"
          class="text-red-500 text-sm font-bold">X</button>

      </div>
    `;
  });

  document.getElementById("total").innerText = total;
}

renderCart();

</script>

</body>
</html>
