<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Animated Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .scene {
            width: 380px;
            height: 480px;
            perspective: 1500px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease-out, box-shadow 0.4s;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateX(5deg); }
            50% { transform: translateY(-25px) rotateX(-5deg); }
        }

        .card-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: inset 0 0 60px rgba(255,255,255,0.6),
                        0 15px 35px rgba(0, 0, 0, 0.3);
            transform-style: preserve-3d;
            position: relative;
        }

        .card-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 35px;
            position: relative;
            z-index: 2;
        }

        .card-img {
            width: 140px;
            height: 140px;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card-title {
            font-size: 32px;
            font-weight: 600;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .card-subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .card-text {
            color: #444;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .btn {
            padding: 14px 40px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.5);
        }

        /* Light reflection */
        .card::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 60%;
            height: 300%;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.4) 0%,
                rgba(255,255,255,0) 50%
            );
            opacity: 0;
            transition: 0.8s;
            transform: rotate(25deg);
            z-index: 3;
            pointer-events: none;
        }

        .card:hover::before {
            opacity: 1;
            top: 120%;
            left: 120%;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="card" id="card">
            <div class="card-inner">
                <div class="card-content">
                    <div class="card-img">✨</div>
                    <h2 class="card-title">Cosmic Card</h2>
                    <p class="card-subtitle">Animated in 3D Space</p>
                    <p class="card-text">Floating animation + smooth mouse tracking + glowing effects</p>
                    <button class="btn">Activate</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const rotateX = (y - rect.height / 2) / 12;
            const rotateY = (rect.width / 2 - x) / 12;

            card.style.transform = `
                perspective(1400px) 
                rotateX(${-rotateX}deg) 
                rotateY(${rotateY}deg)   
                translateZ(50px)
            `;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = `
                perspective(1400px) 
                rotateX(0deg) 
                rotateY(0deg) 
                translateZ(0px)
            `;
        });
    </script>
</body>
</html>
