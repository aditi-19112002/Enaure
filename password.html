<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>

  <title>Animated Password Reveal</title>

  <style>

    @keyframes eyePop{
      0%{
        transform: scale(0.7);
      }
      50%{ 
        transform: scale(1.2);
      }
      100%{
        transform: scale(1);
      }
    }

    .eye-animation{
      animation: eyePop .4s ease;
    }

    @keyframes slideText{
      0%{
        transform: translateY(10px);
        opacity: 0;
      }
      100%{
        transform: translateY(0);
        opacity: 1;
      }
    }

    .text-animation{
      animation: slideText .4s ease;
    }

  </style>
</head>

<body class="bg-black min-h-screen flex items-center justify-center px-4">


  <div class="bg-zinc-900 p-8 rounded-3xl shadow-2xl w-full max-w-md">

    <h1 class="text-white text-3xl font-bold text-center mb-8">
      Password Reveal 
    </h1>

    <div class="relative">

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        class="w-full bg-zinc-800 text-white px-5 py-4 rounded-2xl outline-none border-2 border-zinc-700 focus:border-green-500 transition-all duration-300"
      >

    
      <button
        onclick="togglePassword()"
        id="eyeBtn"
        class="absolute right-4 top-1/2 -translate-y-1/2 text-2xl"
      >
        👁️
      </button>

    </div>

  
    <p
      id="status"
      class="text-center text-zinc-300 mt-5 text-lg font-semibold"
    >
      Hidden Password 🔒
    </p>

  </div>

  <script>

    function togglePassword(){

      const password = document.getElementById("password");
      const eyeBtn = document.getElementById("eyeBtn");
      const status = document.getElementById("status");

      eyeBtn.classList.add("eye-animation");

      setTimeout(() => {
        eyeBtn.classList.remove("eye-animation");
      }, 400);

      if(password.type === "password"){

        password.type = "text";

        eyeBtn.innerHTML = "🙈";

        status.innerHTML = "Password Visible ✅";

        status.classList.add("text-animation");

      }

    
      else{

        password.type = "password";

        eyeBtn.innerHTML = "👁️";

        status.innerHTML = "Hidden Password 🔒";

        status.classList.add("text-animation");

      }

      setTimeout(() => {
        status.classList.remove("text-animation");
      }, 400);

    }

  </script>

</body>
</html>
