<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Download Button</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f172a;
    }

    .download-btn{
      position:relative;
      width:280px;
      height:70px;
      border:none;
      border-radius:60px;
      background:#1e293b;
      color:white;
      font-size:22px;
      font-weight:bold;
      cursor:pointer;
      overflow:hidden;
      transition:0.4s;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    .download-btn:hover{
      transform:scale(1.03);
    }

    .progress{
      position:absolute;
      left:0;
      top:0;
      width:0%;
      height:100%;
      background:linear-gradient(90deg,#06b6d4,#3b82f6);
      border-radius:60px;
      z-index:1;
      transition:width 0.1s linear;
    }

    .text{
      position:relative;
      z-index:2;
      letter-spacing:1px;
    }

    .success{
      background:#16a34a !important;
      box-shadow:0 0 25px rgba(22,163,74,0.7);
    }
  </style>
</head>

<body>

  <button class="download-btn" id="btn">
    <div class="progress" id="progress"></div>
    <span class="text" id="text">Download</span>
  </button>

  <script>
    let btn = document.getElementById("btn");
    let progress = document.getElementById("progress");
    let text = document.getElementById("text");

    let running = false;

    btn.addEventListener("click", () => {

      if(running) return;

      running = true;

      let count = 0;

      btn.classList.remove("success");
      btn.style.background = "#1e293b";

      text.innerHTML = "0%";
      progress.style.width = "0%";

      let interval = setInterval(() => {

        count++;

        progress.style.width = count + "%";
        text.innerHTML = count + "%";

        if(count >= 100){

          clearInterval(interval);

          progress.style.width = "100%";

          setTimeout(() => {
            progress.style.display = "none";

            btn.classList.add("success");

            text.innerHTML = "✔ Downloaded";
          }, 300);

          running = false;
        }

      }, 40);

    });
  </script>

</body>
</html>
