<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white p-6">

  <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
    <img src="https://picsum.photos/id/1015/600/400" class="cursor-pointer rounded" onclick="openViewer(0)">
    <img src="https://picsum.photos/id/1016/600/400" class="cursor-pointer rounded" onclick="openViewer(1)">
    <img src="https://picsum.photos/id/1018/600/400" class="cursor-pointer rounded" onclick="openViewer(2)">
  </div>

  <div id="viewer"
    class="fixed inset-0 bg-black bg-opacity-90 hidden items-center justify-center">

    <button onclick="closeViewer()"
      class="absolute top-5 right-5 text-3xl">✕</button>

    
    <button onclick="prevImage()"
      class="absolute left-5 text-3xl">⬅️</button>


    <button onclick="nextImage()"
      class="absolute right-5 text-3xl">➡️</button>

    <img id="viewImg"
      class="max-w-full max-h-full transition-transform duration-300 cursor-grab">
  </div>

<script>
  const images = [
    "https://picsum.photos/id/1015/1200/800",
    "https://picsum.photos/id/1016/1200/800",
    "https://picsum.photos/id/1018/1200/800"
  ];

  let current = 0;
  let scale = 1;
  let startX = 0;
  let isDragging = false;

  const viewer = document.getElementById("viewer");
  const viewImg = document.getElementById("viewImg");

  function openViewer(index) {
    current = index;
    viewer.classList.remove("hidden");
    viewer.classList.add("flex");
    loadImage();
  }

  function closeViewer() {
    viewer.classList.add("hidden");
    viewer.classList.remove("flex");
    scale = 1;
    viewImg.style.transform = "scale(1)";
  }

  function loadImage() {
    viewImg.src = images[current];
    scale = 1;
    viewImg.style.transform = "scale(1)";
  }

  function nextImage() {
    current = (current + 1) % images.length;
    loadImage();
  }

  function prevImage() {
    current = (current - 1 + images.length) % images.length;
    loadImage();
  }

  viewImg.addEventListener("wheel", (e) => {
    e.preventDefault();
    scale += e.deltaY * -0.001;
    scale = Math.min(Math.max(1, scale), 3);
    viewImg.style.transform = `scale(${scale})`;
  });

 
  viewImg.addEventListener("mousedown", (e) => {
    isDragging = true;
    startX = e.clientX;
  });

  document.addEventListener("mouseup", () => {
    isDragging = false;
  });

  document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    let diff = e.clientX - startX;

    if (diff > 100) {
      prevImage();
      isDragging = false;
    } else if (diff < -100) {
      nextImage();
      isDragging = false;
    }
  });

 
  viewImg.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
  });

  viewImg.addEventListener("touchend", (e) => {
    let endX = e.changedTouches[0].clientX;
    let diff = endX - startX;

    if (diff > 50) prevImage();
    else if (diff < -50) nextImage();
  });
</script>

</body>
</html>
