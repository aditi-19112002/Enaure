<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spotify</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      overflow: hidden;
    }

    .glass{
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 40px rgba(0,255,200,0.15);
    }

    .album{
      animation: rotate 8s linear infinite;
    }

    @keyframes rotate{
      from{
        transform: rotate(0deg);
      }
      to{
        transform: rotate(360deg);
      }
    }

    .wave span{
      display: inline-block;
      width: 5px;
      height: 20px;
      margin: 0 2px;
      border-radius: 10px;
      background: #00ffcc;
      animation: wave 1s infinite ease-in-out;
    }

    .wave span:nth-child(2){
      animation-delay: .1s;
    }

    .wave span:nth-child(3){
      animation-delay: .2s;
    }

    .wave span:nth-child(4){
      animation-delay: .3s;
    }

    .wave span:nth-child(5){
      animation-delay: .4s;
    }

    @keyframes wave{
      0%,100%{
        height: 20px;
      }
      50%{
        height: 60px;
      }
    }

    .glow{
      box-shadow: 0 0 30px #00ffcc;
    }

    .card-hover:hover{
      transform: translateY(-10px) scale(1.02);
    }
  </style>
</head>

<body class="bg-black flex items-center justify-center min-h-screen relative">


  <div class="absolute w-96 h-96 bg-green-500 rounded-full blur-[150px] opacity-20 top-0 left-0"></div>
  <div class="absolute w-96 h-96 bg-cyan-500 rounded-full blur-[150px] opacity-20 bottom-0 right-0"></div>

 
  <div class="glass card-hover transition duration-500 rounded-[40px] p-8 w-[350px] relative z-10">

    
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-white text-2xl font-bold">
          Spotify 2035
        </h1>
        <p class="text-gray-400 text-sm">
          Futuristic Music UI
        </p>
      </div>

      <button class="bg-white/10 p-3 rounded-full hover:bg-white/20 transition">
        🎵
      </button>
    </div>

   
    <div class="flex justify-center mb-8">
      <div class="album glow w-52 h-52 rounded-full overflow-hidden border-4 border-cyan-400">

        <img 
          src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop"
          class="w-full h-full object-cover"
        />

      </div>
    </div>


    <div class="text-center mb-6">
      <h2 class="text-white text-2xl font-bold">
        Night Vibes
      </h2>

      <p class="text-gray-400">
        Future Beats
      </p>
    </div>

   
    <div class="mb-6">
      <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden">
        <div class="w-2/3 h-full bg-cyan-400 rounded-full glow"></div>
      </div>

      <div class="flex justify-between text-gray-400 text-sm mt-2">
        <span>1:32</span>
        <span>3:45</span>
      </div>
    </div>

    
    <div class="flex justify-center items-center gap-6 mb-8">

      <button class="text-white text-2xl hover:scale-125 transition">
        ⏮
      </button>

      <button class="bg-cyan-400 text-black w-16 h-16 rounded-full text-2xl glow hover:scale-110 transition">
        ▶
      </button>

      <button class="text-white text-2xl hover:scale-125 transition">
        ⏭
      </button>

    </div>

  
    <div class="wave flex justify-center items-end h-16">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

</body>
</html>
